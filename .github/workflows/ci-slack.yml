name: CI failure alerts for Slack

on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: main
      workflow-names:
        type: string
        required: true
        description: JSON array of monitored workflow names, or ["*"] for all workflows.
      caller-workflow-path:
        type: string
        required: true
        description: Path of the caller workflow, used to verify saved-state provenance.
      test-delivery:
        type: boolean
        default: false
    secrets:
      slack-webhook-url:
        required: true

permissions:
  actions: read

jobs:
  prepare:
    if: >-
      !inputs.test-delivery && github.event_name == 'schedule' &&
      github.ref == format('refs/heads/{0}', inputs.branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workflow-ids: ${{ steps.notifier.outputs.workflow-ids }}
    steps:
      - name: Load notifier from the called workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        # github.workflow_sha identifies the caller, not this reusable workflow.
        run: &load-notifier |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq '
            [.referenced_workflows[] |
              select(.path | startswith("contentauth/ci-workflows/.github/workflows/ci-slack.yml@")) |
              .sha] | unique |
            if length == 1 then .[0] else error("Cannot identify the called notifier revision") end
          ')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid called notifier revision"
            exit 1
          fi
          curl --fail --silent --show-error --proto '=https' --max-time 60 \
            "https://raw.githubusercontent.com/contentauth/ci-workflows/$sha/scripts/ci-slack.mjs" \
            --output "$RUNNER_TEMP/ci-slack.mjs"
      - name: Discover workflow results to process
        id: notifier
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SLACK_BRANCH: ${{ inputs.branch }}
          CI_SLACK_WORKFLOWS: ${{ inputs.workflow-names }}
          CI_SLACK_CALLER_PATH: ${{ inputs.caller-workflow-path }}
          CI_SLACK_TEST_DELIVERY: ${{ inputs.test-delivery }}
          CI_SLACK_DISCOVER: 'true'
        run: node "$RUNNER_TEMP/ci-slack.mjs"
      - name: Report discovery failures
        if: steps.notifier.outputs.discovery-errors > 0
        run: |
          echo "::error::Reminder discovery failed for one or more workflows; see discovery-failed logs. Other workflows will still be processed."
          exit 1
  notify:
    if: >-
      (inputs.test-delivery && github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', inputs.branch)) ||
      (!inputs.test-delivery && github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == inputs.branch &&
        github.event.workflow_run.path != inputs.caller-workflow-path &&
        (contains(fromJSON(inputs.workflow-names), '*') ||
          contains(fromJSON(inputs.workflow-names), github.event.workflow_run.name)) &&
        contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.status == 'completed' &&
        contains(fromJSON('["success", "failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-slack-${{ inputs.caller-workflow-path }}-${{ inputs.branch }}-${{ github.event.workflow_run.workflow_id || 'test' }}
      queue: max
    env:
      CI_SLACK_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id || 'test' }}
    steps: &notification-steps
      - name: Load notifier from the called workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: *load-notifier
      - name: Evaluate health and deliver Slack notification
        id: notifier
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
          CI_SLACK_BRANCH: ${{ inputs.branch }}
          CI_SLACK_WORKFLOWS: ${{ inputs.workflow-names }}
          CI_SLACK_CALLER_PATH: ${{ inputs.caller-workflow-path }}
          CI_SLACK_TEST_DELIVERY: ${{ inputs.test-delivery }}
        run: node "$RUNNER_TEMP/ci-slack.mjs"
      - name: Save alert state
        if: steps.notifier.outputs.save-state == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-slack-state-${{ env.CI_SLACK_WORKFLOW_ID }}
          path: ci-slack-state.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true
  remind:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.workflow-ids != '' && needs.prepare.outputs.workflow-ids != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        workflow-id: ${{ fromJSON(needs.prepare.outputs.workflow-ids) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-slack-${{ inputs.caller-workflow-path }}-${{ inputs.branch }}-${{ matrix.workflow-id }}
      queue: max
    env:
      CI_SLACK_WORKFLOW_ID: ${{ matrix.workflow-id }}
    steps: *notification-steps
