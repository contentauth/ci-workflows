name: CI failure alerts for Slack

on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: main
      workflow-names:
        type: string
        required: true
        description: JSON array of monitored workflow names, or ["*"] for all workflows.
      caller-workflow-path:
        type: string
        required: true
        description: Path of the caller workflow, used to verify saved-state provenance.
      test-delivery:
        type: boolean
        default: false
    secrets:
      slack-webhook-url:
        required: true

permissions:
  actions: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_run' ||
      (contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) &&
        github.ref == format('refs/heads/{0}', inputs.branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workflow-ids: ${{ steps.notifier.outputs.workflow-ids }}
    steps:
      - name: Load notifier from the called workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        # github.workflow_sha identifies the caller, not this reusable workflow.
        run: &load-notifier |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq '
            [.referenced_workflows[] |
              select(.path | startswith("contentauth/ci-workflows/.github/workflows/ci-slack.yml@")) |
              .sha] | unique |
            if length == 1 then .[0] else error("Cannot identify the called notifier revision") end
          ')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid called notifier revision"
            exit 1
          fi
          curl --fail --silent --show-error --proto '=https' --max-time 60 \
            "https://raw.githubusercontent.com/contentauth/ci-workflows/$sha/scripts/ci-slack.mjs" \
            --output "$RUNNER_TEMP/ci-slack.mjs"
      - name: Discover workflow results to process
        id: notifier
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SLACK_BRANCH: ${{ inputs.branch }}
          CI_SLACK_WORKFLOWS: ${{ inputs.workflow-names }}
          CI_SLACK_CALLER_PATH: ${{ inputs.caller-workflow-path }}
          CI_SLACK_TEST_DELIVERY: ${{ inputs.test-delivery }}
          CI_SLACK_DISCOVER: 'true'
        run: node "$RUNNER_TEMP/ci-slack.mjs"
  notify:
    needs: prepare
    if: needs.prepare.outputs.workflow-ids != '[]'
    strategy:
      fail-fast: false
      matrix:
        workflow-id: ${{ fromJSON(needs.prepare.outputs.workflow-ids) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-slack-${{ inputs.caller-workflow-path }}-${{ inputs.branch }}-${{ matrix.workflow-id }}
      queue: max
    steps:
      - name: Load notifier from the called workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: *load-notifier
      - name: Evaluate health and deliver Slack notification
        id: notifier
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
          CI_SLACK_BRANCH: ${{ inputs.branch }}
          CI_SLACK_WORKFLOWS: ${{ inputs.workflow-names }}
          CI_SLACK_CALLER_PATH: ${{ inputs.caller-workflow-path }}
          CI_SLACK_TEST_DELIVERY: ${{ inputs.test-delivery }}
          CI_SLACK_WORKFLOW_ID: ${{ matrix.workflow-id }}
        run: node "$RUNNER_TEMP/ci-slack.mjs"
      - name: Save alert state
        if: steps.notifier.outputs.save-state == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-slack-state-${{ matrix.workflow-id }}
          path: ci-slack-state.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true
